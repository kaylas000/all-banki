<!-- ШАБЛОН: Горизонтальная карточка (credit-card) -->
<!-- Категории: Кредиты, Карты, Вклады, Ипотека, Инвестиции, РКО -->
<!-- Поля: {{bank}}, {{product}}, {{logo}}, {{badge}}, {{brand_color}}, {{params}}, {{page_url}}, {{btn_text}} -->

<div class="credit-card" data-category="{{category}}" data-name="{{bank}} {{product}}" data-rate="{{rate}}">
  <div class="credit-card-visual">
    <div class="brand-icon">
      <img src="../assets/img/{{logo}}" alt="{{bank}}" style="position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);object-fit:cover">
    </div>
  </div>
  <div class="credit-card-content">
    <div class="credit-card-main">
      <div class="credit-card-brand" style="color:{{brand_color}}">{{bank}} <span class="offer-badge {{badge_class}}">{{badge}}</span></div>
      <div class="credit-card-top">
        <div class="credit-card-title">{{product}}</div>
      </div>
      <div class="credit-params">
        <div class="credit-param">
          <div class="credit-param-val">{{param1_value}}</div>
          <div class="credit-param-lbl">{{param1_label}}</div>
        </div>
        <div class="credit-param">
          <div class="credit-param-val">{{param2_value}}</div>
          <div class="credit-param-lbl">{{param2_label}}</div>
        </div>
      </div>
      <div class="credit-card-actions">
        <a href="{{page_url}}" class="btn-primary">{{btn_text}}</a>
        <a href="{{page_url}}" class="btn-ghost">Подробнее</a>
      </div>
    </div>
    <div class="credit-card-empty">
      <div class="credit-detail-col">
        <h5>{{conditions_title}}</h5>
        <ul>
          {{conditions_list}}
        </ul>
      </div>
      <div class="credit-detail-col">
        <h5>Документы</h5>
        <ul>
          {{documents_list}}
        </ul>
      </div>
    </div>
  </div>
</div>
