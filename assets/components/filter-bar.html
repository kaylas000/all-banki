<div class="filter-bar" id="filterBar">
  <div class="filter-bar-inner">
    <div class="filter-pills" id="filterPills">
      <button class="filter-pill active" data-category="all">Все</button>
      <button class="filter-pill" data-category="credits">Кредиты</button>
      <button class="filter-pill" data-category="cards">Карты</button>
      <button class="filter-pill" data-category="deposits">Вклады</button>
      <button class="filter-pill" data-category="investments">Инвестиции</button>
    </div>
    <input type="text" class="filter-search" id="searchInput" placeholder="Поиск предложений...">
    <select class="filter-sort" id="sortSelect">
      <option value="popular">По популярности</option>
      <option value="rate-asc">Ставка ↑</option>
      <option value="rate-desc">Ставка ↓</option>
      <option value="name">По названию</option>
    </select>
  </div>
</div>
